name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/desktopmove_test.lua
  package:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install --cask hammerspoon
      - run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopMove.spoon
          path: dist/DesktopMove.spoon.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DesktopMove.spoon
          path: dist
      - run: gh release create "$RELEASE_TAG" dist/DesktopMove.spoon.zip --verify-tag --title "DesktopMove $RELEASE_TAG" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
